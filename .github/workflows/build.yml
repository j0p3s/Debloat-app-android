name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Check release tag matches app version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts | head -n 1)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME does not match versionName $version"; exit 1; }
          test -f "docs/RELEASE-$version.md" || { echo "Missing docs/RELEASE-$version.md"; exit 1; }
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Check translations
        run: python3 tools/check_translations.py

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Android lint
        run: ./gradlew lintDebug

      - name: Check release refuses missing signing credentials
        run: |
          if ./gradlew assembleRelease > "$RUNNER_TEMP/unsigned-build-check.txt" 2>&1; then
            echo 'Release build unexpectedly succeeded without signing credentials'
            exit 1
          fi
          grep -q 'Release signing is required' "$RUNNER_TEMP/unsigned-build-check.txt"

      - name: Restore permanent release keystore
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo 'Missing permanent release keystore secret'; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo 'Missing release keystore password secret'; exit 1; }
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/debloater-release.p12"
          keytool -exportcert -keystore "$RUNNER_TEMP/debloater-release.p12" -storetype PKCS12 -alias debloater -storepass:env KEYSTORE_PASSWORD -file "$RUNNER_TEMP/release-certificate.der"
          expected=$(tr -d '[:space:]' < config/release-certificate.sha256)
          actual=$(sha256sum "$RUNNER_TEMP/release-certificate.der" | cut -d ' ' -f 1)
          test "$actual" = "$expected" || { echo 'Keystore secret does not match the pinned release certificate'; exit 1; }

      - name: Build signed release APK
        if: github.event_name != 'pull_request'
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/debloater-release.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Verify permanent release signer
        if: github.event_name != 'pull_request'
        run: |
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          "$apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk > "$RUNNER_TEMP/apk-signature.txt"
          cat "$RUNNER_TEMP/apk-signature.txt"
          expected=$(tr -d '[:space:]' < config/release-certificate.sha256)
          actual=$(sed -n 's/.*certificate SHA-256 digest: //p' "$RUNNER_TEMP/apk-signature.txt" | head -n 1 | tr -d '[:space:]')
          echo "Expected release certificate SHA-256: $expected"
          echo "Actual release certificate SHA-256: $actual"
          test "$actual" = "$expected" || { echo 'Release signing certificate changed; refusing to upload APK'; exit 1; }
          echo "Release certificate SHA-256: $actual"

      - name: Remove temporary keystore
        if: always() && github.event_name != 'pull_request'
        run: rm -f "$RUNNER_TEMP/debloater-release.p12"

      - uses: actions/upload-artifact@v4
        with:
          name: debloater-apks
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk

      - name: Prepare release APK
        if: startsWith(github.ref, 'refs/tags/v')
        run: cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/Debloater-v$RELEASE_VERSION.apk"

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Debloater v${{ env.RELEASE_VERSION }}
          body_path: docs/RELEASE-${{ env.RELEASE_VERSION }}.md
          files: ${{ runner.temp }}/Debloater-v${{ env.RELEASE_VERSION }}.apk
          make_latest: true
